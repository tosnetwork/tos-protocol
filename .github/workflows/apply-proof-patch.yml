name: apply-proof-patch

on:
  push:
    branches:
      - agent/atos-rpc-v0.2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Apply proof reference patch
        run: |
          cat .dev/atosrpc-patch.part.* > /tmp/atosrpc-patch.tar.gz
          tar -xzf /tmp/atosrpc-patch.tar.gz
          rm -rf .dev .github/workflows/apply-proof-patch.yml
          gofmt -w pkg/atosrpc/proof.go pkg/atosrpc/settlement.go pkg/atosrpc/trust.go
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: avoid copying protobuf message locks"
          git push origin HEAD:${{ github.ref_name }}
