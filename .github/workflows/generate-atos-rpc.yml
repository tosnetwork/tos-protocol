name: generate-atos-rpc

on:
  push:
    branches:
      - agent/atos-rpc-v0.2

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install protobuf compiler and generators
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
      - name: Generate protocol bindings
        run: |
          make generate
          gofmt -w gen
      - name: Commit generated bindings
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api gen Makefile
          git commit -m "chore: generate ATOS TOS v0.2 bindings"
          git push origin HEAD:${{ github.ref_name }}
