name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Install root-owned Quote publisher fixture
        run: |
          sudo install -d -o root -g root -m 0755 /usr/local/libexec/tos-protocol-test
          sudo install -o root -g root -m 0755 tests/fixtures/tosctl-chain-publisher /usr/local/libexec/tos-protocol-test/tosctl
      - name: Verify Native protobuf generated sources
        run: scripts/test-native-proto-generated.sh
      - run: make all
      - run: make test-race
      - run: make reproducible-builds
      - run: make release-gates
      - run: make conformance-typescript
