name: export-source

on:
  push:
    branches:
      - agent/atos-rpc-v0.2

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: tos-protocol-source
          path: .
          include-hidden-files: true
          retention-days: 1
