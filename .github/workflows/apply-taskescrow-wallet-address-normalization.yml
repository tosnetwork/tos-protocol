name: apply-taskescrow-wallet-address-normalization

on:
  push:
    branches:
      - agent/fix-taskescrow-wallet-readiness

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-taskescrow-wallet-readiness
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Apply wallet-address normalization fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('pkg/taskescrowpublisher/tosctl.go')
          source = source_path.read_text()

          old_import = '''\t"github.com/tosnetwork/tos-protocol/pkg/chain"\n\t"github.com/tosnetwork/tos-protocol/pkg/toschain"\n)'''
          new_import = '''\t"github.com/tosnetwork/tos-protocol/pkg/chain"\n\t"github.com/tosnetwork/tos-protocol/pkg/toschain"\n\t"github.com/xssnick/tonutils-go/address"\n)'''
          if old_import not in source:
              raise SystemExit('tosctl.go import anchor not found')
          source = source.replace(old_import, new_import, 1)

          old_ready = '''\tfor _, wallet := range listed {\n\t\tif strings.TrimSpace(wallet.Address) == "" {\n\t\t\tcontinue\n\t\t}\n\t\tcanonical, err := toschain.CanonicalAddress(wallet.Address)\n\t\tif err == nil {\n\t\t\tactual[canonical] = wallet.Name\n\t\t}\n\t}'''
          new_ready = '''\tfor _, wallet := range listed {\n\t\tif strings.TrimSpace(wallet.Address) == "" {\n\t\t\tcontinue\n\t\t}\n\t\tcanonical, err := canonicalWalletAddress(wallet.Address)\n\t\tif err == nil {\n\t\t\tactual[canonical] = wallet.Name\n\t\t}\n\t}'''
          if old_ready not in source:
              raise SystemExit('tosctl.go readiness anchor not found')
          source = source.replace(old_ready, new_ready, 1)

          helper_anchor = 'func validateExecutable(path string) (string, error) {'
          helper = '''// canonicalWalletAddress normalizes the local tosctl presentation format to\n// the raw address used for immutable action bindings. Public chain references\n// remain strict: toschain.CanonicalAddress still rejects non-raw addresses.\nfunc canonicalWalletAddress(value string) (string, error) {\n\tvalue = strings.TrimSpace(value)\n\tif value == "" || len(value) > 128 {\n\t\treturn "", errors.New("invalid tosctl wallet address")\n\t}\n\tparsed, err := address.ParseAddr(value)\n\tif err != nil {\n\t\tparsed, err = address.ParseRawAddr(value)\n\t}\n\tif err != nil || parsed == nil || parsed.Type() != address.StdAddress || parsed.BitsLen() != 256 {\n\t\treturn "", errors.New("invalid standard tosctl wallet address")\n\t}\n\treturn parsed.StringRaw(), nil\n}\n\n'''
          if helper_anchor not in source:
              raise SystemExit('tosctl.go helper anchor not found')
          source = source.replace(helper_anchor, helper + helper_anchor, 1)
          source_path.write_text(source)

          test_path = Path('pkg/taskescrowpublisher/tosctl_test.go')
          tests = test_path.read_text()
          old_test_import = '''\t"github.com/tosnetwork/tos-protocol/pkg/chain"\n)'''
          new_test_import = '''\t"github.com/tosnetwork/tos-protocol/pkg/chain"\n\t"github.com/tosnetwork/tos-protocol/pkg/toschain"\n\t"github.com/xssnick/tonutils-go/address"\n)'''
          if old_test_import not in tests:
              raise SystemExit('tosctl_test.go import anchor not found')
          tests = tests.replace(old_test_import, new_test_import, 1)
          tests += '''\nfunc TestCanonicalWalletAddressAcceptsTosctlPresentationWithoutWeakeningReferences(t *testing.T) {\n\traw := "0:" + strings.Repeat("11", 32)\n\tparsed, err := address.ParseRawAddr(raw)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tfriendly := parsed.String()\n\tif friendly == raw {\n\t\tt.Fatal("expected a user-friendly tosctl presentation")\n\t}\n\tfor _, input := range []string{raw, friendly} {\n\t\tgot, err := canonicalWalletAddress(input)\n\t\tif err != nil {\n\t\t\tt.Fatalf("normalize %q: %v", input, err)\n\t\t}\n\t\tif got != raw {\n\t\t\tt.Fatalf("normalize %q = %q, want %q", input, got, raw)\n\t\t}\n\t}\n\tif _, err := toschain.CanonicalAddress(friendly); err == nil {\n\t\tt.Fatal("public chain references must continue rejecting user-friendly addresses")\n\t}\n}\n'''
          test_path.write_text(tests)
          PY
          gofmt -w pkg/taskescrowpublisher/tosctl.go pkg/taskescrowpublisher/tosctl_test.go
          git diff --check
      - name: Validate fix
        shell: bash
        run: |
          set -euo pipefail
          go test ./pkg/taskescrowpublisher
          go test -race ./pkg/taskescrowpublisher
          go vet ./pkg/taskescrowpublisher
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pkg/taskescrowpublisher/tosctl.go pkg/taskescrowpublisher/tosctl_test.go
          git commit -m 'fix: normalize tosctl wallet addresses for publisher readiness'
          git push origin HEAD:agent/fix-taskescrow-wallet-readiness
