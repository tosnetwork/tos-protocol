syntax = "proto3";

package atos.tos.v1;

option go_package = "github.com/tosnetwork/tos-protocol/gen/atos/tos/v1;atostosv1";

// Common ATOS <-> TOS protocol types. These contracts are canonical inputs
// for tos-protocol, tos-ai, and ATOS.
message RequestContext {
  string request_id = 1;
  string trace_id = 2;
  string idempotency_key = 3;
  string caller_id = 4;
  int64 deadline_unix_millis = 5;
}

enum TrustMode {
  TRUST_MODE_UNSPECIFIED = 0;
  TRUST_MODE_MANAGED = 1;
  TRUST_MODE_VERIFIED = 2;
  TRUST_MODE_NATIVE = 3;
}

enum RequestedTrustMode {
  REQUESTED_TRUST_MODE_UNSPECIFIED = 0;
  REQUESTED_TRUST_MODE_MANAGED = 1;
  REQUESTED_TRUST_MODE_VERIFIED = 2;
  REQUESTED_TRUST_MODE_NATIVE = 3;
  REQUESTED_TRUST_MODE_AUTO = 4;
}

enum ProofProfile {
  PROOF_PROFILE_UNSPECIFIED = 0;
  PROOF_PROFILE_NONE = 1;
  PROOF_PROFILE_TOS_VERIFIED_V1 = 2;
  PROOF_PROFILE_TOS_NATIVE_V1 = 3;
}

message Digest {
  string algorithm = 1;
  bytes value = 2;
}

message NetworkReference {
  string network = 1;
  string reference = 2;
  // Finalized is true only when a chain-backed Authority independently
  // observed this exact reference as finalized and non-reorganized.
  bool finalized = 3;
  // Network-specific finalized checkpoint (TOS masterchain sequence number).
  // Zero for local/non-finalized authorities.
  uint64 finalized_checkpoint = 4;
}

message Money {
  string amount = 1;
  string currency = 2;
}

message NetworkAmount {
  string asset = 1;
  string atomic_amount = 2;
}

message ArtifactCommitment {
  string artifact_id = 1;
  string content_type = 2;
  uint64 size_bytes = 3;
  Digest digest = 4;
}

message ProofRequirements {
  bool network_verifiable_receipt = 1;
  bool tos_settlement = 2;
  bool portable_proof_of_service = 3;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_SUBMITTED = 1;
  JOB_STATE_WORKING = 2;
  JOB_STATE_INPUT_REQUIRED = 3;
  JOB_STATE_COMPLETED = 4;
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELED = 6;
  JOB_STATE_REJECTED = 7;
  JOB_STATE_UNCERTAIN = 8;
}

enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_NOT_REQUIRED = 1;
  VERIFICATION_STATUS_PENDING = 2;
  VERIFICATION_STATUS_VERIFIED = 3;
  VERIFICATION_STATUS_FAILED = 4;
}

message ProofStatus {
  VerificationStatus quote = 1;
  VerificationStatus escrow = 2;
  VerificationStatus receipt = 3;
  VerificationStatus settlement = 4;
}

message Usage {
  uint64 input_bytes = 1;
  uint64 output_bytes = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  uint64 execution_millis = 5;
  map<string, string> extensions = 6;
}

message ErrorDetail {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  map<string, string> metadata = 4;
}

message PageRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}
