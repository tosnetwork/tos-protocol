syntax = "proto3";

package atos.tos.v1;

option go_package = "github.com/tosnetwork/tos-protocol/gen/atos/tos/v1;atostosv1";

import "atos/tos/v1/common.proto";
import "atos/tos/v1/proof.proto";

service SettlementService {
  rpc CreateEscrow(CreateEscrowRequest) returns (CreateEscrowResponse);
  rpc GetEscrow(GetEscrowRequest) returns (GetEscrowResponse);
  rpc ReleaseEscrow(ReleaseEscrowRequest) returns (ReleaseEscrowResponse);
  rpc SettleJob(SettleJobRequest) returns (SettleJobResponse);
  rpc GetSettlement(GetSettlementRequest) returns (GetSettlementResponse);
  rpc PrepareVerifiedResult(PrepareVerifiedResultRequest) returns (PrepareVerifiedResultResponse);
  rpc OpenVerifiedDispute(OpenVerifiedDisputeRequest) returns (OpenVerifiedDisputeResponse);
  rpc ResolveVerifiedDispute(ResolveVerifiedDisputeRequest) returns (ResolveVerifiedDisputeResponse);
}

enum EscrowState {
  ESCROW_STATE_UNSPECIFIED = 0;
  ESCROW_STATE_RESERVED = 1;
  ESCROW_STATE_DISPUTED = 2;
  ESCROW_STATE_SETTLED = 3;
  ESCROW_STATE_RELEASED = 4;
}

enum SettlementState {
  SETTLEMENT_STATE_UNSPECIFIED = 0;
  SETTLEMENT_STATE_PENDING = 1;
  SETTLEMENT_STATE_SETTLED = 2;
  SETTLEMENT_STATE_RELEASED = 3;
  SETTLEMENT_STATE_DISPUTED = 4;
  SETTLEMENT_STATE_FAILED = 5;
}

message Escrow {
  string escrow_id = 1;
  string quote_id = 2;
  string principal_id = 3;
  string provider_id = 4;
  string capability_id = 5;
  TrustMode trust_mode = 6;
  ProofProfile proof_profile = 7;
  NetworkAmount reserved = 8;
  EscrowState state = 9;
  int64 created_unix_millis = 10;
  int64 expires_unix_millis = 11;
  NetworkReference escrow_ref = 12;
  string funding_model = 13;
  string job_id = 14;
  string capability_version = 15;
  string quote_commitment_digest = 16;
  NetworkReference quote_commitment_ref = 17;
  string reservation_digest = 18;
  string reservation_action_id = 19;
  string contract_code_hash = 20;
  bool finalized = 21;
  uint64 finalized_checkpoint = 22;
  NetworkReference release_ref = 23;
  string release_digest = 24;
  string release_action_id = 25;
  string release_reason_code = 26;
  NetworkReference terminal_ref = 27;
  NetworkReference result_ref = 28;
  int64 review_deadline_unix_millis = 29;
  string dispute_digest = 30;
  NetworkReference dispute_ref = 31;
  string dispute_resolution_digest = 32;
  string dispute_outcome = 33;
  string result_digest = 34;
  string result_evidence_digest = 35;
}

message VerifiedEscrowTerms {
  string version = 1;
  string canonicalization = 2;
  string network_id = 3;
  string domain = 4;
  string escrow_id = 5;
  string job_id = 6;
  string quote_id = 7;
  string quote_commitment_digest = 8;
  NetworkReference quote_commitment_ref = 9;
  string principal_id = 10;
  string requester_agent_id = 11;
  string provider_id = 12;
  string capability_id = 13;
  string capability_version = 14;
  Digest manifest_digest = 15;
  NetworkReference ownership_ref = 16;
  TrustMode trust_mode = 17;
  ProofProfile proof_profile = 18;
  NetworkAmount reserve = 19;
  uint32 asset_decimals = 20;
  string settlement_backend = 21;
  string settlement_asset = 22;
  string funding_model = 23;
  int64 acceptance_deadline_unix_millis = 24;
  int64 execution_deadline_unix_millis = 25;
  int64 escrow_deadline_unix_millis = 26;
  string underlying_service_quote_ref = 27;
  Digest dispute_policy_digest = 28;
  string signer_authorization_id = 29;
  NetworkReference signer_authorization_ref = 30;
  NetworkAmount subtotal = 31;
  NetworkAmount fees = 32;
  Digest terms_digest = 33;
}

message CreateEscrowRequest {
  RequestContext context = 1;
  string quote_id = 2;
  string principal_id = 3;
  string provider_id = 4;
  string capability_id = 5;
  TrustMode trust_mode = 6;
  ProofProfile proof_profile = 7;
  NetworkAmount reserve = 8;
  string funding_model = 9;
  int64 expires_unix_millis = 10;
  VerifiedEscrowTerms verified_terms = 11;
}

message CreateEscrowResponse {
  Escrow escrow = 1;
  bool created = 2;
}

message GetEscrowRequest {
  RequestContext context = 1;
  string escrow_id = 2;
  string quote_id = 3;
  VerifiedEscrowTerms expected_terms = 4;
  NetworkReference expected_escrow_ref = 5;
  string expected_reservation_digest = 6;
  NetworkReference expected_terminal_ref = 7;
  string expected_release_digest = 8;
  string expected_release_reason_code = 9;
  string expected_dispute_digest = 10;
  NetworkReference expected_dispute_ref = 11;
  NetworkAmount expected_dispute_payout = 12;
}

message GetEscrowResponse {
  Escrow escrow = 1;
  bool found = 2;
}

message ReleaseEscrowRequest {
  RequestContext context = 1;
  string escrow_id = 2;
  string quote_id = 3;
  string job_id = 4;
  string reason_code = 5;
  VerifiedEscrowTerms expected_terms = 6;
  NetworkReference expected_escrow_ref = 7;
  string expected_reservation_digest = 8;
}

message ReleaseEscrowResponse {
  Escrow escrow = 1;
  NetworkReference release_ref = 2;
  bool released = 3;
}

message PrepareVerifiedResultRequest {
  RequestContext context = 1;
  string escrow_id = 2;
  string quote_id = 3;
  string job_id = 4;
  string receipt_id = 5;
  VerifiedEscrowTerms expected_terms = 6;
  NetworkReference expected_escrow_ref = 7;
  string expected_reservation_digest = 8;
  ExecutionReceiptEnvelope expected_receipt = 9;
  NetworkReference expected_receipt_ref = 10;
}
message PrepareVerifiedResultResponse { Escrow escrow = 1; bool prepared = 2; }

message VerifiedDisputeOpen {
  string version = 1;
  string network_id = 2;
  string gateway_domain = 3;
  string dispute_id = 4;
  string escrow_id = 5;
  string job_id = 6;
  string quote_id = 7;
  string receipt_id = 8;
  string principal_id = 9;
  string provider_id = 10;
  string capability_id = 11;
  string capability_version = 12;
  string quote_commitment_digest = 13;
  string reservation_digest = 14;
  string receipt_digest = 15;
  Digest dispute_policy_digest = 16;
  string reason_code = 17;
  repeated Digest evidence_digests = 18;
  int64 opened_unix_millis = 19;
}
message OpenVerifiedDisputeRequest {
  RequestContext context = 1;
  VerifiedDisputeOpen dispute = 2;
  VerifiedEscrowTerms expected_terms = 3;
  NetworkReference expected_escrow_ref = 4;
  string expected_reservation_digest = 5;
  string expected_result_hash = 6;
  string expected_evidence_hash = 7;
  NetworkReference expected_result_ref = 8;
  ExecutionReceiptEnvelope expected_receipt = 9;
  NetworkReference expected_receipt_ref = 10;
}
message OpenVerifiedDisputeResponse {
  Escrow escrow = 1;
  string dispute_digest = 2;
  NetworkReference dispute_ref = 3;
  bool opened = 4;
}

message VerifiedDisputeResolution {
  string version = 1;
  string network_id = 2;
  string gateway_domain = 3;
  string dispute_id = 4;
  string escrow_id = 5;
  string job_id = 6;
  string quote_id = 7;
  string receipt_id = 8;
  string dispute_digest = 9;
  string outcome = 10;
  string reviewer_principal_id = 11;
  NetworkAmount reserved = 12;
  NetworkAmount provider_payout = 13;
  NetworkAmount requester_refund = 14;
  int64 resolved_unix_millis = 15;
}
message ResolveVerifiedDisputeRequest {
  RequestContext context = 1;
  VerifiedDisputeResolution resolution = 2;
  VerifiedEscrowTerms expected_terms = 3;
  NetworkReference expected_escrow_ref = 4;
  string expected_reservation_digest = 5;
  NetworkReference expected_dispute_ref = 6;
  ExecutionReceiptEnvelope expected_receipt = 7;
  NetworkReference expected_receipt_ref = 8;
}
message ResolveVerifiedDisputeResponse {
  Escrow escrow = 1;
  Settlement settlement = 2;
  string resolution_digest = 3;
  NetworkReference resolution_ref = 4;
  bool resolved = 5;
}


message Settlement {
  string settlement_id = 1;
  string escrow_id = 2;
  string quote_id = 3;
  string job_id = 4;
  string receipt_id = 5;
  NetworkAmount charged = 6;
  NetworkAmount refunded = 7;
  SettlementState state = 8;
  NetworkReference settlement_ref = 9;
  int64 settled_unix_millis = 10;
}

message SettleJobRequest {
  RequestContext context = 1;
  string escrow_id = 2;
  string quote_id = 3;
  string job_id = 4;
  string receipt_id = 5;
  NetworkAmount requested_charge = 6;
  VerifiedEscrowTerms expected_terms = 7;
  NetworkReference expected_escrow_ref = 8;
  string expected_reservation_digest = 9;
}

message SettleJobResponse {
  Settlement settlement = 1;
  Escrow escrow = 2;
  bool created = 3;
}

message GetSettlementRequest {
  RequestContext context = 1;
  string settlement_id = 2;
  string job_id = 3;
  string receipt_id = 4;
}

message GetSettlementResponse {
  Settlement settlement = 1;
  bool found = 2;
}
