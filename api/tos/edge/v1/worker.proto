syntax = "proto3";

package tos.edge.v1;

option go_package = "github.com/tosnetwork/tos-protocol/gen/tos/edge/v1;edgev1";

// WorkerService is the private, versioned boundary between Edge Core and a
// vertical worker. It is intended for an authenticated local transport such as
// a mode-0600 Unix socket, not direct Internet exposure.
service WorkerService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc Quote(QuoteRequest) returns (QuoteResponse);
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
}

// WorkerStreamService is the v0.2 bounded result-streaming extension. Keeping
// it separate preserves the frozen unary WorkerService v0.1 interface.
service WorkerStreamService {
  rpc InvokeStream(InvokeStreamRequest) returns (stream StreamEvent);
  rpc ResumeStream(ResumeStreamRequest) returns (stream StreamEvent);
}

// ThirdPartyExecutionService is a v0.3 extension alongside WorkerService,
// kept as its own service for the same reason WorkerStreamService is kept
// separate from WorkerService: it does not touch the frozen existing
// interfaces. It dispatches to a third-party provider endpoint (HTTP/MCP/A2A)
// instead of this worker's own model-serving runtime.
//
// See atos-spec docs/THIRD_PARTY_EXECUTION_PLANE.md for the cross-repository
// design. The load-bearing invariant this service exists to enforce: a
// caller names a binding, it never grants one. Every RPC here MUST reject
// any (transport, endpoint_ref, capability_id) combination not present in
// this worker's own operator-curated allowlist before performing any
// outbound network call -- an inbound request payload must never be able to
// select a destination its operator did not already approve, preserving the
// same "task payloads cannot select the endpoint" invariant the existing
// model-serving adapters (e.g. the openai adapter) already enforce.
service ThirdPartyExecutionService {
  rpc Health(ThirdPartyHealthRequest) returns (ThirdPartyHealthResponse);
  rpc Invoke(ThirdPartyInvokeRequest) returns (ThirdPartyInvokeResponse);
  rpc Query(ThirdPartyQueryRequest) returns (ThirdPartyQueryResponse);
  rpc Cancel(ThirdPartyCancelRequest) returns (ThirdPartyCancelResponse);
}

enum ThirdPartyTransport {
  THIRD_PARTY_TRANSPORT_UNSPECIFIED = 0;
  THIRD_PARTY_TRANSPORT_HTTP = 1;
  THIRD_PARTY_TRANSPORT_MCP = 2;
  THIRD_PARTY_TRANSPORT_A2A = 3;
}

enum ThirdPartyInvokeStatus {
  THIRD_PARTY_INVOKE_STATUS_UNSPECIFIED = 0;
  THIRD_PARTY_INVOKE_STATUS_COMPLETED = 1;
  THIRD_PARTY_INVOKE_STATUS_FAILED = 2;
  THIRD_PARTY_INVOKE_STATUS_PENDING = 3;
}

// ThirdPartyBindingRef names a binding the caller wants dispatched or
// probed. binding_commitment lets the worker detect a replay whose semantic
// binding changed (an idempotency_conflict) without needing to know how the
// caller derived its own binding-freeze/selection logic.
message ThirdPartyBindingRef {
  ThirdPartyTransport transport = 1;
  string endpoint_ref = 2;
  string capability_id = 3;
  string capability_version = 4;
  string binding_commitment = 5;
}

message ThirdPartyHealthRequest {
  ThirdPartyBindingRef binding = 1;
}

message ThirdPartyHealthResponse {
  bool healthy = 1;
  int64 latency_millis = 2;
  string failure_reason = 3;
  // deep_probe distinguishes bare reachability from a transport-specific
  // deeper check (see atos-spec docs/THIRD_PARTY_EXECUTION_PLANE.md and the
  // interim ATOS-side provideradapter.CertificationProbe precedent this
  // mirrors) -- callers must not treat every healthy=true the same way
  // regardless of this flag.
  bool deep_probe = 4;
  map<string, string> evidence = 5;
}

message ThirdPartyInvokeRequest {
  // request_id is the stable idempotency identity for this exact semantic
  // operation -- mirrors InvokeRequest.request_id and MUST NOT be
  // regenerated across a caller's own retries after a timeout or restart.
  string request_id = 1;
  string job_id = 2;
  string provider_id = 3;
  ThirdPartyBindingRef binding = 4;
  bytes input = 5;
  int64 deadline_unix_millis = 6;
  // Worker task state and any terminal result must remain queryable until
  // this retention boundary, mirroring InvokeRequest.retain_until_unix_millis.
  int64 retain_until_unix_millis = 7;
  string request_digest = 8;
  // max_output_bytes is the ATOS-quoted output limit for this exact Job
  // (mirroring InvokeRequest.max_output_bytes). Unlike the native
  // model-serving path, a third-party provider has no contractual
  // obligation to bound its own output, so the caller (Edge Core) is
  // responsible for enforcing this against the returned output size --
  // 0 means unbounded (the operator's own MaxResponseBytes wire-envelope
  // limit still applies independently at the worker).
  uint64 max_output_bytes = 9;
}

message ThirdPartyInvokeResponse {
  string request_id = 1;
  ThirdPartyInvokeStatus status = 2;
  bytes output = 3;
  string failure_reason = 4;
  // Worker-owned durable completion time. Invoke and Query MUST return the
  // same millisecond value so receipt replay is independent of RPC latency,
  // mirroring InvokeResponse.completed_unix_millis.
  int64 completed_unix_millis = 5;
  // Reuses the same portable receipt-usage vocabulary as InvokeResponse's
  // Usage -- input/output byte and token counts, execution time.
  Usage usage = 6;
}

message ThirdPartyQueryRequest {
  string request_id = 1;
  ThirdPartyBindingRef binding = 2;
}

// ThirdPartyQueryResponse's found=false means this worker has no record of
// ever attempting request_id -- a safe signal that Invoke was never called,
// or never reached the provider, for it. Some transports (MCP has no
// protocol-level lookup-by-id operation) may legitimately always report
// found=false; callers must not treat that as an error.
message ThirdPartyQueryResponse {
  bool found = 1;
  ThirdPartyInvokeResponse result = 2;
}

message ThirdPartyCancelRequest {
  string request_id = 1;
  ThirdPartyBindingRef binding = 2;
  string reason = 3;
}

message ThirdPartyCancelResponse {
  bool accepted = 1;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_EMERGENCY = 1;
  PRIORITY_CONTROL = 2;
  PRIORITY_REALTIME_PERCEPTION = 3;
  PRIORITY_LOCAL_ASYNC = 4;
  PRIORITY_EXTERNAL_SERVICE = 5;
  PRIORITY_BACKGROUND = 6;
}

enum EvidenceLevel {
  EVIDENCE_LEVEL_UNSPECIFIED = 0;
  EVIDENCE_LEVEL_DECLARED = 1;
  EVIDENCE_LEVEL_OBSERVED = 2;
  EVIDENCE_LEVEL_BENCHMARKED = 3;
  EVIDENCE_LEVEL_AUDITED = 4;
  EVIDENCE_LEVEL_ATTESTED = 5;
  EVIDENCE_LEVEL_REPLICATED = 6;
  EVIDENCE_LEVEL_CRYPTOGRAPHICALLY_PROVEN = 7;
}

enum ReadinessStatus {
  READINESS_STATUS_UNSPECIFIED = 0;
  READINESS_STATUS_READY = 1;
  READINESS_STATUS_DEGRADED = 2;
  READINESS_STATUS_UNAVAILABLE = 3;
  READINESS_STATUS_UNKNOWN = 4;
  READINESS_STATUS_DRAINING = 5;
}

enum ResourceClass {
  RESOURCE_CLASS_UNSPECIFIED = 0;
  RESOURCE_CLASS_COMPUTE = 1;
  RESOURCE_CLASS_ACCELERATOR = 2;
  RESOURCE_CLASS_MEMORY = 3;
  RESOURCE_CLASS_STORAGE = 4;
  RESOURCE_CLASS_NETWORK = 5;
  RESOURCE_CLASS_RUNTIME = 6;
  RESOURCE_CLASS_DEVICE = 7;
  RESOURCE_CLASS_OTHER = 8;
}

enum ResourceUnit {
  RESOURCE_UNIT_UNSPECIFIED = 0;
  RESOURCE_UNIT_COUNT = 1;
  RESOURCE_UNIT_BYTES = 2;
  RESOURCE_UNIT_MILLISECONDS = 3;
  RESOURCE_UNIT_MILLIWATTS = 4;
  RESOURCE_UNIT_BITS_PER_SECOND = 5;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_NOT_FOUND = 1;
  TASK_STATUS_ACCEPTED = 2;
  TASK_STATUS_RUNNING = 3;
  TASK_STATUS_SUCCEEDED = 4;
  TASK_STATUS_FAILED = 5;
  TASK_STATUS_CANCELED = 6;
  TASK_STATUS_TIMED_OUT = 7;
}

message ClaimEvidence {
  EvidenceLevel level = 1;
  string issuer = 2;
  int64 collected_unix_millis = 3;
  int64 expires_unix_millis = 4;
  string digest = 5;
  string reference = 6;
}

message ReadinessComponent {
  string id = 1;
  ReadinessStatus status = 2;
  string revision = 3;
  string reason_code = 4;
  ClaimEvidence evidence = 5;
}

message ResourceClaim {
  string id = 1;
  ResourceClass resource_class = 2;
  ResourceUnit unit = 3;
  uint64 total = 4;
  uint64 owner_reserved = 5;
  uint64 available_external = 6;
  string revision = 7;
  ClaimEvidence evidence = 8;
  map<string, string> attributes = 9;
}

message ResourceLimit {
  string id = 1;
  ResourceUnit unit = 2;
  uint64 quantity = 3;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
  repeated ReadinessComponent readiness = 3;
}

message GetCapabilitiesRequest {}

message Capability {
  string service_id = 1;
  string operation = 2;
  string model = 3;
  string model_digest = 4;
  string runtime = 5;
  string runtime_revision = 6;
  uint64 max_input_bytes = 7;
  uint64 max_output_bytes = 8;
  repeated Priority accepted_priorities = 9;
  repeated ResourceLimit admission_limits = 10;
}

message GetCapabilitiesResponse {
  repeated Capability capabilities = 1;
  string capacity_revision = 2;
  repeated ResourceClaim resources = 3;
  string terminal_revision = 4;
  int64 collected_unix_millis = 5;
  int64 expires_unix_millis = 6;
}

message QuoteRequest {
  string request_id = 1;
  string service_id = 2;
  string operation = 3;
  string model = 4;
  uint64 input_bytes = 5;
  uint64 max_output_bytes = 6;
  int64 deadline_unix_millis = 7;
  Priority priority = 8;
  repeated ResourceLimit requested_limits = 9;
}

message QuoteResponse {
  string quote_id = 1;
  string request_id = 2;
  int64 expires_unix_millis = 3;
  uint64 price_nano_tos = 4;
  string capacity_revision = 5;
  string model_revision = 6;
  string runtime_revision = 7;
  repeated ResourceLimit committed_limits = 8;
}

message InvokeRequest {
  string request_id = 1;
  string quote_id = 2;
  string task_id = 3;
  string service_id = 4;
  string operation = 5;
  string model = 6;
  bytes payload = 7;
  uint64 max_output_bytes = 8;
  int64 deadline_unix_millis = 9;
  Priority priority = 10;
  // Edge computes this internal commitment with request_digest cleared,
  // persists it in the execution claim, and sends the populated value.
  string request_digest = 11;
  // Worker task state and any terminal result must remain queryable until
  // this Edge journal retention boundary.
  int64 retain_until_unix_millis = 12;
}

message Usage {
  // Worker v0.1 portable receipt vocabulary. Host CPU, peak-memory, block-IO,
  // accelerator and energy counters remain local policy/audit evidence and
  // must not be silently mapped into these fields.
  uint64 input_bytes = 1;
  uint64 output_bytes = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  uint64 execution_millis = 5;
}

message InvokeResponse {
  string request_id = 1;
  bytes output = 2;
  Usage usage = 3;
  string model_revision = 4;
  string runtime_revision = 5;
  // Worker-owned durable completion time. Invoke and GetTask MUST return the
  // same millisecond value so receipt replay is independent of RPC latency.
  int64 completed_unix_millis = 6;
}

message GetTaskRequest {
  string request_id = 1;
  string task_id = 2;
  string request_digest = 3;
  int64 retain_until_unix_millis = 4;
}

message GetTaskResponse {
  string request_id = 1;
  string task_id = 2;
  string request_digest = 3;
  TaskStatus status = 4;
  InvokeResponse result = 5;
  string error_code = 6;
  int64 completed_unix_millis = 7;
  int64 retain_until_unix_millis = 8;
}

message CancelRequest {
  string request_id = 1;
  string task_id = 2;
  string request_digest = 3;
}

message CancelResponse {
  string request_id = 1;
  string task_id = 2;
  string request_digest = 3;
  bool accepted = 4;
}

message InvokeStreamRequest {
  InvokeRequest invocation = 1;
  uint64 max_chunk_bytes = 2;
}

message ResumeStreamRequest {
  GetTaskRequest task = 1;
  uint64 next_sequence = 2;
  uint64 max_chunk_bytes = 3;
  string expected_stream_digest = 4;
  uint64 next_offset = 5;
}

// StreamEvent chunks a single durably retained terminal result. Chunks are
// provisional until the final event. stream_digest commits to the complete
// ordered output, not merely to a prefix.
message StreamEvent {
  string request_id = 1;
  string task_id = 2;
  string request_digest = 3;
  uint64 sequence = 4;
  bytes chunk = 5;
  uint64 total_output_bytes = 6;
  string stream_digest = 7;
  bool terminal = 8;
  TaskStatus terminal_status = 9;
  Usage usage = 10;
  string model_revision = 11;
  string runtime_revision = 12;
  int64 completed_unix_millis = 13;
  string error_code = 14;
  uint64 offset = 15;
}
